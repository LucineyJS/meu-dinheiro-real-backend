name: CI/CD  Pipeline - Meu Dinheiro Real BackEnd

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs: # --- 1: CI(Segurança e Compilação)
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escanear por Chaves Expostas (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          extra_args: --only-verified

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Dar permissão ao Gradle
        run: chmod +x ./gradlew

      - name: Build da aplicação
        run: ./gradlew build -x test

  # --- 2: CD (Entrega Continua) ---
  deploy:
    name: Deploy em Produção
    needs: security-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Ckeckout do Código
        uses: actions/checkout@v4

      - name: Disparar Deploy na Hospedagem
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_WEBHOOK_URL }}"